name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    nix:
        name: Nix
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Restore and save Nix store
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
                  gc-max-store-size-linux: 2G

            - name: Check flake
              run: nix flake check --print-build-logs

    php:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: dom, gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Check whitespace
              run: git diff --check

            - name: Run PHP-CS-Fixer
              if: matrix.php-version == '8.2'
              run: composer cs

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress --error-format=raw --memory-limit=1G

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=never --no-coverage

            - name: Discover benchmarks
              if: matrix.php-version == '8.2'
              run: composer benchmark:smoke

            - name: Run mutation tests
              if: matrix.php-version == '8.2'
              run: composer infection:ci

    lowest-dependencies:
        name: Lowest dependencies / PHP 8.2
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: dom, gmp
                  php-version: "8.2"
                  tools: composer:v2

            - name: Install lowest supported dependencies
              run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress --error-format=raw --memory-limit=1G

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=never --no-coverage

    carbon:
        name: Carbon ${{ matrix.carbon-version }} / ${{ matrix.compatibility-mode }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - carbon-version: "2.62.1"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - carbon-version: "2"
                      compatibility-mode: plain
                      package-mode: archive
                      php-version: "8.2"
                    - carbon-version: "3.0.0"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - carbon-version: "3.1.1"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - carbon-version: "3.2.0"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - carbon-version: "3"
                      compatibility-mode: plain
                      package-mode: archive
                      php-version: "8.2"
                    - carbon-version: "3"
                      compatibility-mode: larastan
                      package-mode: source
                      php-version: "8.2"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-php-${{ matrix.php-version }}-carbon-${{ matrix.carbon-version }}-${{
                      matrix.compatibility-mode }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-carbon-${{ matrix.carbon-version }}-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-carbon-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run:
                  tests/Consumer/run ${{ matrix.package-mode }} carbon ${{ matrix.carbon-version }} ${{
                  matrix.compatibility-mode }}

    getid3:
        name: getID3 ${{ matrix.getid3-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - getid3-version: "1.9.22"
                      package-mode: source
                      php-version: "8.2"
                    - getid3-version: "1"
                      package-mode: archive
                      php-version: "8.2"
                    - getid3-version: "2"
                      package-mode: source
                      php-version: "8.2"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-getid3-${{ matrix.getid3-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-getid3-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} getid3 ${{ matrix.getid3-version }}

    guzzle:
        name:
            Guzzle ${{ matrix.guzzle-version }} / ${{ matrix.package-mode }} / ${{ matrix.vendor-directory }} / PHP ${{
            matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - guzzle-version: "7"
                      package-mode: source
                      php-version: "8.2"
                      vendor-directory: vendor
                    - guzzle-version: "8"
                      package-mode: archive
                      php-version: "8.2"
                      vendor-directory: vendor
                    - guzzle-version: "7.10.0"
                      package-mode: source
                      php-version: "8.2"
                      vendor-directory: vendor
                    - guzzle-version: "7.11.0"
                      package-mode: source
                      php-version: "8.2"
                      vendor-directory: vendor
                    - guzzle-version: "8"
                      package-mode: source
                      php-version: "8.2"
                      vendor-directory: dependencies
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-guzzle-${{ matrix.guzzle-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-guzzle-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  CONSUMER_VENDOR_DIR: ${{ matrix.vendor-directory }}
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} guzzle ${{ matrix.guzzle-version }}

    illuminate-cache:
        name:
            Illuminate Cache ${{ matrix.illuminate-version }} / ${{ matrix.compatibility-mode }} / PHP ${{
            matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                illuminate-version:
                    - "11"
                    - "12"
                    - "13"
                compatibility-mode:
                    - plain
                    - larastan
                include:
                    - illuminate-version: "11"
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "12"
                      compatibility-mode: plain
                      package-mode: archive
                      php-version: "8.2"
                    - illuminate-version: "12"
                      compatibility-mode: larastan
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "13"
                      package-mode: source
                      php-version: "8.3"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-cache-${{ matrix.illuminate-version
                      }}-${{ matrix.compatibility-mode }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-cache-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run:
                  tests/Consumer/run ${{ matrix.package-mode }} illuminate-cache ${{ matrix.illuminate-version }} ${{
                  matrix.compatibility-mode }}

            - name: Test manual registration
              if: matrix.illuminate-version == '12' && matrix.compatibility-mode == 'plain'
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run source manual 12

            - name: Test manual registration with nondefault vendor directory
              if: matrix.illuminate-version == '12' && matrix.compatibility-mode == 'plain'
              env:
                  CONSUMER_VENDOR_DIR: dependencies
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run source manual 12

    illuminate-http:
        name:
            Illuminate HTTP ${{ matrix.illuminate-version }} / ${{ matrix.compatibility-mode }} / PHP ${{
            matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                illuminate-version:
                    - "11"
                    - "12"
                    - "13"
                compatibility-mode:
                    - plain
                    - larastan
                include:
                    - illuminate-version: "11"
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "12"
                      compatibility-mode: plain
                      package-mode: archive
                      php-version: "8.2"
                    - illuminate-version: "12"
                      compatibility-mode: larastan
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "13"
                      package-mode: source
                      php-version: "8.3"
                    - illuminate-version: "11.35.0"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "11.35.1"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-http-${{ matrix.illuminate-version
                      }}-${{ matrix.compatibility-mode }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-http-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run:
                  tests/Consumer/run ${{ matrix.package-mode }} illuminate-http ${{ matrix.illuminate-version }} ${{
                  matrix.compatibility-mode }}

    additional-illuminate-integrations:
        name:
            ${{ matrix.integration-label }} ${{ matrix.illuminate-version }} / ${{ matrix.compatibility-mode }} / PHP
            ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                integration:
                    - illuminate-cookie
                    - illuminate-filesystem
                    - illuminate-process
                    - illuminate-queue
                    - illuminate-support
                illuminate-version:
                    - "11"
                    - "12"
                    - "13"
                compatibility-mode:
                    - plain
                    - larastan
                include:
                    - illuminate-version: "11"
                      php-version: "8.2"
                    - illuminate-version: "12"
                      php-version: "8.2"
                    - illuminate-version: "13"
                      php-version: "8.3"
                    - integration: illuminate-cookie
                      integration-label: Illuminate Cookie
                    - integration: illuminate-filesystem
                      integration-label: Illuminate Filesystem
                    - integration: illuminate-process
                      integration-label: Illuminate Process
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "11.52.0"
                      compatibility-mode: plain
                      php-version: "8.2"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "11.53.0"
                      compatibility-mode: plain
                      php-version: "8.2"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "12.59.0"
                      compatibility-mode: plain
                      php-version: "8.2"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "12.60.0"
                      compatibility-mode: plain
                      php-version: "8.2"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "13.9.0"
                      compatibility-mode: plain
                      php-version: "8.3"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "13.10.0"
                      compatibility-mode: plain
                      php-version: "8.3"
                    - integration: illuminate-support
                      integration-label: Illuminate Support
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-${{ matrix.integration }}-${{ matrix.illuminate-version }}-${{
                      matrix.compatibility-mode }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.integration }}-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run:
                  tests/Consumer/run source ${{ matrix.integration }} ${{ matrix.illuminate-version }} ${{
                  matrix.compatibility-mode }}

    laravel-framework:
        name:
            Laravel Framework ${{ matrix.laravel-version }} / ${{ matrix.compatibility-mode }} / PHP ${{
            matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                laravel-version:
                    - "11"
                    - "12"
                    - "13"
                compatibility-mode:
                    - plain
                    - larastan
                include:
                    - laravel-version: "11"
                      package-mode: source
                      php-version: "8.2"
                    - laravel-version: "12"
                      compatibility-mode: plain
                      package-mode: archive
                      php-version: "8.2"
                    - laravel-version: "12"
                      compatibility-mode: larastan
                      package-mode: source
                      php-version: "8.2"
                    - laravel-version: "13"
                      package-mode: source
                      php-version: "8.3"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-framework-${{ matrix.laravel-version }}-${{
                      matrix.compatibility-mode }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-framework-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integrations through Laravel framework
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run:
                  tests/Consumer/run ${{ matrix.package-mode }} laravel-framework ${{ matrix.laravel-version }} ${{
                  matrix.compatibility-mode }}

    phpgeo:
        name: phpgeo ${{ matrix.phpgeo-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - phpgeo-version: "4"
                      package-mode: source
                      php-version: "8.2"
                    - phpgeo-version: "5"
                      package-mode: archive
                      php-version: "8.2"
                    - phpgeo-version: "6"
                      package-mode: source
                      php-version: "8.2"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-phpgeo-${{ matrix.phpgeo-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-phpgeo-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} phpgeo ${{ matrix.phpgeo-version }}

    symfony-http-foundation:
        name:
            Symfony HttpFoundation ${{ matrix.http-foundation-version }} / ${{ matrix.compatibility-mode }} / PHP ${{
            matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - http-foundation-version: "6.4.0"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - http-foundation-version: "6"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - http-foundation-version: "6"
                      compatibility-mode: phpstan-symfony
                      package-mode: source
                      php-version: "8.2"
                    - http-foundation-version: "7.2.9"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - http-foundation-version: "7.3.0"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - http-foundation-version: "7"
                      compatibility-mode: plain
                      package-mode: archive
                      php-version: "8.2"
                    - http-foundation-version: "7"
                      compatibility-mode: phpstan-symfony
                      package-mode: source
                      php-version: "8.2"
                    - http-foundation-version: "8.0.0"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.4"
                    - http-foundation-version: "8"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.4"
                    - http-foundation-version: "8"
                      compatibility-mode: phpstan-symfony
                      package-mode: source
                      php-version: "8.4"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-php-${{ matrix.php-version }}-symfony-http-foundation-${{
                      matrix.http-foundation-version }}-${{ matrix.compatibility-mode }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-symfony-http-foundation-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run:
                  tests/Consumer/run ${{ matrix.package-mode }} symfony-http-foundation ${{
                  matrix.http-foundation-version }} ${{ matrix.compatibility-mode }}

    symfony-stopwatch:
        name:
            Symfony Stopwatch ${{ matrix.stopwatch-version }} / ${{ matrix.compatibility-mode }} / PHP ${{
            matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - stopwatch-version: "6"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.2"
                    - stopwatch-version: "6"
                      compatibility-mode: phpstan-symfony
                      package-mode: source
                      php-version: "8.2"
                    - stopwatch-version: "7"
                      compatibility-mode: plain
                      package-mode: archive
                      php-version: "8.2"
                    - stopwatch-version: "7"
                      compatibility-mode: phpstan-symfony
                      package-mode: source
                      php-version: "8.2"
                    - stopwatch-version: "8"
                      compatibility-mode: plain
                      package-mode: source
                      php-version: "8.4"
                    - stopwatch-version: "8"
                      compatibility-mode: phpstan-symfony
                      package-mode: source
                      php-version: "8.4"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-symfony-stopwatch-${{ matrix.stopwatch-version }}-${{ matrix.compatibility-mode
                      }}
                  restore-keys: |
                      ${{ runner.os }}-symfony-stopwatch-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install Apocrypha test tooling
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run:
                  tests/Consumer/run ${{ matrix.package-mode }} symfony-stopwatch ${{ matrix.stopwatch-version }} ${{
                  matrix.compatibility-mode }}
