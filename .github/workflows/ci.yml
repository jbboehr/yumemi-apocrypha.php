name: conventional-ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    php:
        name: Conventional PHP / PHP 8.2
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: curl, dom, gmp, zip
                  php-version: "8.2"
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.2-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Validate Git archive payload
              run: |
                  git archive --worktree-attributes --format=tar \
                    --output="$RUNNER_TEMP/yumemi-apocrypha-git.tar" HEAD
                  php tools/check-package.php "$RUNNER_TEMP/yumemi-apocrypha-git.tar"

            - name: Run PHP-CS-Fixer
              run: composer cs

            - name: Run PHPStan
              run: composer analyse

            - name: Run PHPUnit
              run: composer test
