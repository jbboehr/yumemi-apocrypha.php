name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    nix:
        name: Nix
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Restore and save Nix store
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
                  gc-max-store-size-linux: 2G

            - name: Check flake
              run: nix flake check --print-build-logs

    php:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: dom, gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Check whitespace
              run: git diff --check

            - name: Run PHP-CS-Fixer
              if: matrix.php-version == '8.2'
              run: composer cs

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress --error-format=raw

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=never --no-coverage

            - name: Run mutation tests
              if: matrix.php-version == '8.2'
              run: composer infection:ci

    lowest-dependencies:
        name: Lowest dependencies / PHP 8.2
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: dom, gmp
                  php-version: "8.2"
                  tools: composer:v2

            - name: Install lowest supported dependencies
              run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress --error-format=raw

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=never --no-coverage

    guzzle:
        name: Guzzle ${{ matrix.guzzle-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - guzzle-version: "7"
                      package-mode: source
                      php-version: "8.2"
                    - guzzle-version: "8"
                      package-mode: archive
                      php-version: "8.2"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-guzzle-${{ matrix.guzzle-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-guzzle-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} guzzle ${{ matrix.guzzle-version }}

    illuminate-cache:
        name: Illuminate Cache ${{ matrix.illuminate-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - illuminate-version: "11"
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "12"
                      package-mode: archive
                      php-version: "8.2"
                    - illuminate-version: "13"
                      package-mode: source
                      php-version: "8.3"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-cache-${{ matrix.illuminate-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-cache-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} illuminate-cache ${{ matrix.illuminate-version }}

            - name: Test manual registration
              if: matrix.illuminate-version == '12'
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run source manual 12

    illuminate-http:
        name: Illuminate HTTP ${{ matrix.illuminate-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - illuminate-version: "11"
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "12"
                      package-mode: archive
                      php-version: "8.2"
                    - illuminate-version: "13"
                      package-mode: source
                      php-version: "8.3"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-http-${{ matrix.illuminate-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-http-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} illuminate-http ${{ matrix.illuminate-version }}

    additional-illuminate-integrations:
        name: ${{ matrix.integration-label }} ${{ matrix.illuminate-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - integration: illuminate-cookie
                      integration-label: Illuminate Cookie
                      illuminate-version: "11"
                      php-version: "8.2"
                    - integration: illuminate-cookie
                      integration-label: Illuminate Cookie
                      illuminate-version: "12"
                      php-version: "8.2"
                    - integration: illuminate-cookie
                      integration-label: Illuminate Cookie
                      illuminate-version: "13"
                      php-version: "8.3"
                    - integration: illuminate-filesystem
                      integration-label: Illuminate Filesystem
                      illuminate-version: "11"
                      php-version: "8.2"
                    - integration: illuminate-filesystem
                      integration-label: Illuminate Filesystem
                      illuminate-version: "12"
                      php-version: "8.2"
                    - integration: illuminate-filesystem
                      integration-label: Illuminate Filesystem
                      illuminate-version: "13"
                      php-version: "8.3"
                    - integration: illuminate-process
                      integration-label: Illuminate Process
                      illuminate-version: "11"
                      php-version: "8.2"
                    - integration: illuminate-process
                      integration-label: Illuminate Process
                      illuminate-version: "12"
                      php-version: "8.2"
                    - integration: illuminate-process
                      integration-label: Illuminate Process
                      illuminate-version: "13"
                      php-version: "8.3"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "11"
                      php-version: "8.2"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "12"
                      php-version: "8.2"
                    - integration: illuminate-queue
                      integration-label: Illuminate Queue
                      illuminate-version: "13"
                      php-version: "8.3"
                    - integration: illuminate-support
                      integration-label: Illuminate Support
                      illuminate-version: "11"
                      php-version: "8.2"
                    - integration: illuminate-support
                      integration-label: Illuminate Support
                      illuminate-version: "12"
                      php-version: "8.2"
                    - integration: illuminate-support
                      integration-label: Illuminate Support
                      illuminate-version: "13"
                      php-version: "8.3"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-${{ matrix.integration }}-${{ matrix.illuminate-version }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.integration }}-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run source ${{ matrix.integration }} ${{ matrix.illuminate-version }}

    phpgeo:
        name: phpgeo ${{ matrix.phpgeo-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - phpgeo-version: "4"
                      package-mode: source
                      php-version: "8.2"
                    - phpgeo-version: "5"
                      package-mode: archive
                      php-version: "8.2"
                    - phpgeo-version: "6"
                      package-mode: source
                      php-version: "8.2"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-phpgeo-${{ matrix.phpgeo-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-phpgeo-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} phpgeo ${{ matrix.phpgeo-version }}

    symfony-stopwatch:
        name: Symfony Stopwatch ${{ matrix.stopwatch-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - stopwatch-version: "6"
                      package-mode: source
                      php-version: "8.2"
                    - stopwatch-version: "7"
                      package-mode: archive
                      php-version: "8.2"
                    - stopwatch-version: "8"
                      package-mode: source
                      php-version: "8.4"
        steps:
            - name: Checkout Apocrypha
              uses: actions/checkout@v7

            - name: Checkout Yumemi
              uses: actions/checkout@v7
              with:
                  path: tmp/yumemi
                  repository: jbboehr/yumemi.php

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-symfony-stopwatch-${{ matrix.stopwatch-version }}
                  restore-keys: |
                      ${{ runner.os }}-symfony-stopwatch-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test integration
              env:
                  YUMEMI_PACKAGE_DIR: ${{ github.workspace }}/tmp/yumemi
              run: tests/Consumer/run ${{ matrix.package-mode }} symfony-stopwatch ${{ matrix.stopwatch-version }}
