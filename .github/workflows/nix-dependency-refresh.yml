name: nix-dependency-refresh

on:
    schedule:
        - cron: "17 8 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    refresh:
        name: Refresh Nix dependency snapshot
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Restore Nix store
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('composer.lock', '**/*.nix', '**/flake.lock') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
                  save: false

            - name: Refresh development-head inputs
              run: |
                  nix flake update \
                    yumemi-development-head \
                    phpstan-laravel-validation-development-head
                  if ! git diff --quiet -- flake.lock; then
                      printf 'Development-head inputs changed during the scheduled audit.\n' \
                        >> "$GITHUB_STEP_SUMMARY"
                      git diff -- flake.lock
                  fi

            - name: Refresh compatible consumer dependency locks
              run: |
                  nix run -L .#refresh-consumer-locks
                  if ! git diff --quiet -- tests/Consumer/locks; then
                      printf 'Compatible consumer dependency locks changed during the scheduled audit.\n' \
                        >> "$GITHUB_STEP_SUMMARY"
                      git diff --name-status -- tests/Consumer/locks
                  fi

            - name: Prepare and verify refreshed consumer dependencies
              run: |
                  hash_report="$RUNNER_TEMP/consumer-composer-cache-hash-report"
                  : > "$hash_report"

                  set +e
                  NIX_HASH_REPORT_PATH="$hash_report" \
                      bash .github/scripts/nix-build-with-hash-report .#consumer-composer-cache
                  build_status=$?
                  set -e

                  if ((build_status != 0)); then
                      mapfile -t reported_hashes < "$hash_report"
                      if ((${#reported_hashes[@]} != 1)); then
                          printf 'The refreshed cache failed without exactly one actionable hash report.\n' >&2
                          exit "$build_status"
                      fi

                      IFS=$'\t' read -r hash_file replacement_hash extra <<< "${reported_hashes[0]}"
                      if [[ $hash_file != nix/consumer-cache-hash.nix \
                          || ! $replacement_hash =~ ^sha256-[A-Za-z0-9+/=]+$ \
                          || -n $extra ]]; then
                          printf 'The refreshed cache produced an unexpected hash report: %s\n' \
                              "${reported_hashes[0]}" >&2
                          exit "$build_status"
                      fi

                      printf '"%s"\n' "$replacement_hash" > "$hash_file"
                      printf 'Temporarily applied the refreshed consumer-cache hash so validation can continue.\n' \
                          >> "$GITHUB_STEP_SUMMARY"
                  fi

                  bash .github/scripts/nix-build-with-hash-report .#consumer-composer-cache
                  bash .github/scripts/nix-build-with-hash-report --rebuild .#consumer-composer-cache

            - name: Run normal validation against refreshed dependencies
              run: nix flake check --keep-going -L
